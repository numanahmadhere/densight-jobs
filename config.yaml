# ------------------------------------------------------------------
# AI Jobs in Pakistan: pipeline settings
# Edit this file to change what gets scraped and how jobs are classified.
# ------------------------------------------------------------------

sites:
  indeed:
    # Indeed understands OR, "exact phrases", (groups) and -excluded words,
    # and searches the job description too. Fewer, smarter queries catch more.
    results_per_query: 100
    queries:
      - '"machine learning" OR "deep learning" OR "artificial intelligence" OR "AI engineer" OR "ML engineer"'
      - '"data scientist" OR "data science"'
      - '"generative AI" OR LLM OR "large language model" OR RAG OR "prompt engineer" OR "AI agent"'
      - '"computer vision" OR NLP OR "natural language processing"'
      - '"data engineer" OR "data analyst" OR "business intelligence" OR "power bi" OR "analytics engineer"'
      # Generic titles whose description mentions AI work (e.g. "Software Engineer" building LLM features)
      - '(developer OR engineer) (LLM OR "machine learning" OR "generative AI" OR "deep learning" OR PyTorch) -sales -marketing -teacher'

  linkedin:
    results_per_query: 25       # LinkedIn blocks fast; keep this small
    queries:
      - "machine learning"
      - "artificial intelligence"
      - "data scientist"
      - "AI engineer"
      - "generative AI"
      - "LLM"
      - "computer vision"
      - "NLP"
      - "data engineer"
      - "data analyst"
    # Track every job at chosen employers. Each entry is a LinkedIn company ID (a number).
    # To find one: open the company's LinkedIn page > Jobs > "See all jobs".
    # The address bar then contains f_C=NUMBER. Add that number below, e.g.  - 1234567
    company_ids: []
    company_results: 100

# Company career pages (official public job feeds, no scraping). Only jobs located in
# Pakistan are kept. Add a company with one line:  board-name: "Display Name"
# The board name is the part of the careers URL after the domain, e.g.
#   job-boards.greenhouse.io/gomotive  -> gomotive
#   jobs.lever.co/smart-working-solutions -> smart-working-solutions
#   apply.workable.com/devsinc-17 -> devsinc-17
career_pages:
  greenhouse:
    gomotive: "Motive"
    careem: "Careem"
    podium81: "Podium"
    joblogic: "Joblogic"
    nysonian: "Nysonian"
    vectara: "Vectara"
    interviewengineering: "Interview Engineering"
    apiphani: "apiphani"
  lever:
    smart-working-solutions: "Smart Working"
  workable:
    devsinc-17: "Devsinc"
    pakistan-mobile-communication-limited-pmcl: "Jazz"
    9dtechnologies-1: "9D Technologies"
    skylabs-ai: "Skylabs AI"
    inbox-business-technologies: "Inbox Business Technologies"
    volga-partners: "Volga Partners"

# Remote job boards. These jobs are shown in a separate "Remote (global)" section and are
# NOT counted in the Pakistan market numbers. Only jobs whose location matches open_to are kept.
remote_boards:
  remoteok: true
  weworkremotely: true
  open_to: 'worldwide|anywhere|global|asia|apac|pakistan'

# Optional: if LinkedIn keeps blocking, add a GitHub secret named PROXIES
# (comma-separated, e.g. user:pass@host:port,user:pass@host2:port). Used automatically.

location: "Pakistan"
country_indeed: "Pakistan"
hours_old: 48                   # daily run looks back 2 days; dedupe removes overlap
feed_window_days: 3             # career pages / remote boards: only jobs posted in the last 3 days count as new
pause_seconds: 6                # wait between searches to reduce blocking
fetch_description: true         # needed for skills; slower

# Public sheet banner (row 1 of every weekly tab)
signup_url: "https://forms.gle/REPLACE_WITH_YOUR_FORM"
brand: "Densight Labs"

# How long a company + title combo counts as the same job (catches reposts)
repost_window_days: 30

# ------------------------------------------------------------------
# Classification. A job is kept only if its TITLE matches one category.
# Checked top to bottom; first match wins. Patterns are regex, case-insensitive.
# ------------------------------------------------------------------
categories:
  - name: "GenAI / LLM"
    title: '\b(gen(erative)?[\s-]?ai|llms?|large language|prompt engineer|rag\b|langchain|ai agent|agentic|conversational ai|chatbot)'
  - name: "ML / AI Engineering"
    title: '\b(machine learning|ml\b|mlops|ai\b|a\.i\.|artificial intelligence|deep learning|computer vision|\bcv engineer|nlp|natural language|ai/ml|ml/ai|applied scientist|research scientist)'
  - name: "Data Science"
    title: '\bdata scien'
  - name: "Data Engineering"
    title: '\b(data engineer|big data|etl developer|analytics engineer|data platform|data architect)'
  - name: "Data Analytics / BI"
    title: '\b(data analyst|business intelligence|\bbi\b|bi developer|bi analyst|power bi|analytics (lead|manager|specialist)|insights analyst|reporting analyst)'

# Generic engineering titles are kept as "AI-adjacent Engineering" when the description
# mentions at least `min_hits` different AI terms below (catches "Software Engineer" on LLM work).
ai_adjacent:
  title: '\b(engineer|developer|programmer|architect|scientist|researcher)\b'
  min_hits: 2
  description_terms:
    - '\bllms?\b'
    - 'large language model'
    - 'generative ai|gen ?ai'
    - 'machine learning'
    - 'deep learning'
    - 'pytorch'
    - 'tensorflow'
    - '\brag\b|retrieval[- ]augmented'
    - 'langchain|langgraph'
    - 'computer vision'
    - '\bnlp\b|natural language processing'
    - 'hugging ?face'
    - 'openai|anthropic|\bgpt-?\d'
    - 'fine-?tun'
    - 'vector (db|database)|embeddings'

# Titles containing these are dropped even if they match above
exclude_title: '\b(sales|teacher|tutor|lecturer|nurse|driver|accountant|receptionist|graphic designer|data entry|call center|telesales)\b'

cities:
  Lahore: ['lahore']
  Karachi: ['karachi']
  Islamabad: ['islamabad']
  Rawalpindi: ['rawalpindi']
  Faisalabad: ['faisalabad']
  Peshawar: ['peshawar']
  Multan: ['multan']
  Hyderabad: ['hyderabad']
  Quetta: ['quetta']
  Sialkot: ['sialkot']
  Gujranwala: ['gujranwala']

seniority:   # checked in order on the title
  Internship: '\b(intern|internship|trainee)\b'
  Entry: '\b(junior|jr\.?|associate|entry|graduate|fresh)\b'
  Leadership: '\b(head|director|vp|vice president|chief|principal|cto|cdo)\b'
  Lead / Manager: '\b(lead|manager|staff)\b'
  Senior: '\b(senior|sr\.?)\b'

skills:
  Python: '\bpython\b'
  SQL: '\bsql\b'
  Excel: '\bexcel\b'
  Power BI: 'power\s?bi'
  Tableau: '\btableau\b'
  Statistics: '\bstatistic'
  Machine Learning: 'machine learning'
  Deep Learning: 'deep learning'
  NLP: '\bnlp\b|natural language'
  Computer Vision: 'computer vision|opencv'
  LLMs: '\bllms?\b|large language model'
  Generative AI: 'generative ai|gen ?ai'
  RAG: '\brag\b|retrieval[- ]augmented'
  LangChain: 'langchain|langgraph'
  OpenAI / GPT: 'openai|\bgpt'
  Prompt Engineering: 'prompt engineering'
  Vector DBs: 'vector (db|database)|pinecone|chroma|weaviate|faiss|pgvector'
  PyTorch: 'pytorch'
  TensorFlow: 'tensorflow|keras'
  scikit-learn: 'scikit|sklearn'
  Hugging Face: 'hugging ?face|transformers'
  Spark: '\b(py)?spark\b'
  Airflow: 'airflow'
  dbt: '\bdbt\b'
  Docker: 'docker'
  Kubernetes: 'kubernetes|\bk8s\b'
  MLOps: 'mlops|mlflow|kubeflow'
  AWS: '\baws\b|amazon web services|sagemaker'
  Azure: '\bazure\b'
  GCP: '\bgcp\b|google cloud|vertex ai|bigquery'
  Snowflake: 'snowflake'
  Databricks: 'databricks'
