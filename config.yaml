# ------------------------------------------------------------------
# AI Jobs in Pakistan: pipeline settings
# Edit this file to change what gets scraped and how jobs are classified.
# ------------------------------------------------------------------

# Searches run every day on each site below
search_terms:
  - "machine learning"
  - "artificial intelligence"
  - "data scientist"
  - "AI engineer"
  - "generative AI"
  - "LLM"
  - "computer vision"
  - "NLP"
  - "data engineer"
  - "data analyst"

sites:
  indeed:
    results_per_term: 50
  linkedin:
    results_per_term: 25        # LinkedIn blocks fast; keep this small

location: "Pakistan"
country_indeed: "Pakistan"
hours_old: 48                   # daily run looks back 2 days; dedupe removes overlap
pause_seconds: 6                # wait between searches to reduce blocking
fetch_description: true         # needed for skills; slower

# Public sheet banner (row 1 of every weekly tab)
signup_url: "https://forms.gle/REPLACE_WITH_YOUR_FORM"
brand: "Densight Labs"

# How long a company + title combo counts as the same job (catches reposts)
repost_window_days: 30

# ------------------------------------------------------------------
# Classification. A job is kept only if its TITLE matches one category.
# Checked top to bottom; first match wins. Patterns are regex, case-insensitive.
# ------------------------------------------------------------------
categories:
  - name: "GenAI / LLM"
    title: '\b(gen(erative)?[\s-]?ai|llms?|large language|prompt engineer|rag\b|langchain|ai agent|agentic|conversational ai|chatbot)'
  - name: "ML / AI Engineering"
    title: '\b(machine learning|ml\b|mlops|ai\b|a\.i\.|artificial intelligence|deep learning|computer vision|\bcv engineer|nlp|natural language|ai/ml|ml/ai|applied scientist|research scientist)'
  - name: "Data Science"
    title: '\bdata scien'
  - name: "Data Engineering"
    title: '\b(data engineer|big data|etl developer|analytics engineer|data platform|data architect)'
  - name: "Data Analytics / BI"
    title: '\b(data analyst|business intelligence|\bbi\b|bi developer|bi analyst|power bi|analytics (lead|manager|specialist)|insights analyst|reporting analyst)'

# Titles containing these are dropped even if they match above
exclude_title: '\b(sales|teacher|tutor|lecturer|nurse|driver|accountant|receptionist|graphic designer|data entry|call center|telesales)\b'

cities:
  Lahore: ['lahore']
  Karachi: ['karachi']
  Islamabad: ['islamabad']
  Rawalpindi: ['rawalpindi']
  Faisalabad: ['faisalabad']
  Peshawar: ['peshawar']
  Multan: ['multan']
  Hyderabad: ['hyderabad']
  Quetta: ['quetta']
  Sialkot: ['sialkot']
  Gujranwala: ['gujranwala']

seniority:   # checked in order on the title
  Internship: '\b(intern|internship|trainee)\b'
  Entry: '\b(junior|jr\.?|associate|entry|graduate|fresh)\b'
  Leadership: '\b(head|director|vp|vice president|chief|principal|cto|cdo)\b'
  Lead / Manager: '\b(lead|manager|staff)\b'
  Senior: '\b(senior|sr\.?)\b'

skills:
  Python: '\bpython\b'
  SQL: '\bsql\b'
  Excel: '\bexcel\b'
  Power BI: 'power\s?bi'
  Tableau: '\btableau\b'
  Statistics: '\bstatistic'
  Machine Learning: 'machine learning'
  Deep Learning: 'deep learning'
  NLP: '\bnlp\b|natural language'
  Computer Vision: 'computer vision|opencv'
  LLMs: '\bllms?\b|large language model'
  Generative AI: 'generative ai|gen ?ai'
  RAG: '\brag\b|retrieval[- ]augmented'
  LangChain: 'langchain|langgraph'
  OpenAI / GPT: 'openai|\bgpt'
  Prompt Engineering: 'prompt engineering'
  Vector DBs: 'vector (db|database)|pinecone|chroma|weaviate|faiss|pgvector'
  PyTorch: 'pytorch'
  TensorFlow: 'tensorflow|keras'
  scikit-learn: 'scikit|sklearn'
  Hugging Face: 'hugging ?face|transformers'
  Spark: '\b(py)?spark\b'
  Airflow: 'airflow'
  dbt: '\bdbt\b'
  Docker: 'docker'
  Kubernetes: 'kubernetes|\bk8s\b'
  MLOps: 'mlops|mlflow|kubeflow'
  AWS: '\baws\b|amazon web services|sagemaker'
  Azure: '\bazure\b'
  GCP: '\bgcp\b|google cloud|vertex ai|bigquery'
  Snowflake: 'snowflake'
  Databricks: 'databricks'
