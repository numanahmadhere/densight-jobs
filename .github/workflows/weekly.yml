name: Weekly report

on:
  schedule:
    - cron: "0 4 * * 1"      # Monday 09:00 Pakistan time (after the daily scrape)
  workflow_dispatch:
    inputs:
      week:
        description: "Rebuild a specific week, e.g. 2026-W41 (leave blank for last week)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build weekly report
        id: build
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_SECRET: ${{ secrets.APPS_SCRIPT_SECRET }}
          WEEK: ${{ inputs.week }}
        run: |
          python -m pipeline.weekly
          echo "dir=$(ls -td reports/*/ | head -1)" >> "$GITHUB_OUTPUT"

      - name: Show summary on the run page
        run: cat "${{ steps.build.outputs.dir }}summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload charts and summary (download from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: ${{ steps.build.outputs.dir }}

      - name: Commit report
        run: |
          git config user.name "ai-jobs-bot"
          git config user.email "ai-jobs-bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Weekly report $(date -u +%F)"
          git push
