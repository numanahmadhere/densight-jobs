name: Daily scrape

on:
  schedule:
    - cron: "0 2 * * *"      # 07:00 Pakistan time, every day
  workflow_dispatch:           # "Run workflow" button for manual runs
    inputs:
      lookback_days:
        description: "One-time backfill: days to look back (e.g. 14). Leave blank for a normal run."
        required: false
        default: ""

permissions:
  contents: write             # lets the job commit data/jobs.csv back to the repo

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape and push to Sheets
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_SECRET: ${{ secrets.APPS_SCRIPT_SECRET }}
          PROXIES: ${{ secrets.PROXIES }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        run: python -m pipeline.scrape

      - name: Build and email market analysis PDF (only when new jobs were found)
        if: success()
        continue-on-error: true        # a report problem must never break data collection
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_SECRET: ${{ secrets.APPS_SCRIPT_SECRET }}
        run: python -m pipeline.analysis

      - name: Keep the PDF on the run page (Artifacts)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: market-analysis
          path: out_report/*.pdf
          if-no-files-found: ignore

      - name: Commit job history
        if: always()
        run: |
          git config user.name "ai-jobs-bot"
          git config user.email "ai-jobs-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily scrape $(date -u +%F)"
          git pull --rebase origin main || true
          git push
